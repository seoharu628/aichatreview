<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>익명 평점</title>
<style>
:root{--paper:#E7ECEC;--card:#F6F8F8;--ink:#14211F;--teal:#1F4E45;--amber:#C98A18;--muted:#77857F;--line:#C9D2D0}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 system-ui,sans-serif}
.wrap{max-width:560px;margin:auto;padding:28px 20px 80px}h1,h2,h3{font-family:serif}h1{font-size:31px;margin:0}.sub,.muted{color:var(--muted);font-size:13px}
.listhead{margin-top:24px;border-bottom:1.5px solid var(--ink);padding-bottom:8px;display:flex;justify-content:space-between}
.row{width:100%;display:flex;align-items:flex-start;gap:16px;padding:16px 2px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;overflow:visible}.row>.score{flex:0 0 70px;width:70px}.row>span:nth-child(2){flex:1 1 auto;min-width:0;display:block;overflow:visible}
.score{font:600 30px serif;text-align:right}.name{font-size:17px;font-weight:600}.meta{font-size:12px;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}.btn{border:1px solid var(--ink);background:none;padding:10px 15px}.solid{background:var(--teal);color:white;border-color:var(--teal);width:100%}
.back{border:0;background:none;color:var(--muted);padding:8px 0}.detail{border-bottom:1.5px solid var(--ink);padding-bottom:16px}
.avg{font:800 50px serif}.write{margin:18px 0}.review{background:var(--card);border-left:3px solid var(--teal);padding:14px 16px;margin:10px 0}
.stars{color:var(--amber);font-size:18px;letter-spacing:2px}.tagwrap{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.tag{font-size:11px;border:1px solid var(--line);padding:2px 7px;color:var(--muted)}
.sheet{position:fixed;inset:0;background:#14211f73;display:none;align-items:flex-end;z-index:10}.sheet.on{display:flex}
.box{background:var(--paper);width:100%;max-width:560px;margin:auto 0 0;padding:22px 20px 30px;max-height:92vh;overflow:auto}
label{display:block;color:var(--muted);font-size:13px;margin:12px 0 5px}textarea{width:100%;min-height:100px;resize:vertical;padding:10px;border:1px solid var(--line);font:16px/1.7 inherit;background:var(--card)}
.starpick{display:flex;gap:4px}.starpick button{border:0;background:none;font-size:30px;color:var(--line);padding:2px}.starpick button.on{color:var(--amber)}
.groups{display:grid;gap:12px}.gtitle{font-size:12px;color:var(--muted)}.choices{display:flex;flex-wrap:wrap;gap:6px}.choice{background:var(--card);border:1px solid var(--line);padding:7px 9px;font-size:12px}.choice.on{background:var(--teal);color:white;border-color:var(--teal)}
.actions{display:flex;gap:8px;margin-top:18px}.actions>*{flex:1}.empty{padding:30px;text-align:center;color:var(--muted)}
 .stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.stat{background:var(--card);border:1px solid var(--line);padding:7px 10px;font-size:12px}.review-actions{display:flex;gap:6px;margin-top:10px}.review-actions button{padding:4px 8px;font-size:12px}.adminbar{margin-top:35px;padding-top:15px;border-top:1px solid var(--line)}.admin-item{background:var(--card);padding:12px;margin:8px 0;border-left:3px solid var(--amber)} .danger{border-color:#9b3333!important;color:#9b3333!important}
</style>
<style>
.platform-card, .platform-card * { box-sizing: border-box; }
.platform-card .platform-name, .platform-card .name, .platform-card h3,
.platform-card h4, .platform-card strong {
  white-space: normal !important;
  overflow: visible !important;
  text-overflow: clip !important;
  word-break: keep-all !important;
  overflow-wrap: anywhere;
}
.platform-card { min-width: 0; }
</style>
<style>
#moreBtn{position:fixed;top:12px;right:14px;z-index:9999;border:0;background:transparent;font-size:24px;letter-spacing:2px;line-height:1;padding:4px 8px;cursor:pointer}
.admin-modal[hidden]{display:none!important}.admin-modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9998;display:flex;align-items:center;justify-content:center;padding:18px}
.admin-window{position:relative;width:min(560px,100%);max-height:85vh;overflow:auto;background:var(--bg,#fff);border:1px solid var(--line,#ddd);padding:24px;border-radius:14px}
.admin-close{position:absolute;right:12px;top:8px;border:0;background:transparent;font-size:28px;cursor:pointer}
.admin-window input{width:100%;padding:10px;margin:12px 0;box-sizing:border-box}
#platforms .row{min-width:0}
#platforms .row .name{display:block;white-space:normal!important;overflow:visible!important;text-overflow:clip!important;word-break:keep-all!important;overflow-wrap:anywhere!important;max-width:none!important;line-height:1.35}
#platforms .row>span:nth-child(2){min-width:0;overflow:visible!important}
#platforms .row .name{
  display:block!important;
  width:auto!important;
  max-width:none!important;
  min-width:0!important;
  white-space:nowrap!important;
  overflow:visible!important;
  text-overflow:clip!important;
  word-break:keep-all!important;
  overflow-wrap:normal!important;
  font-size:18px!important;
  line-height:1.5!important;
}
#platforms .row .meta{display:block!important}
</style></head><body>
<button id="moreBtn" aria-label="관리자 메뉴">•••</button>
<div id="adminModal" class="admin-modal" hidden>
  <div class="admin-window">
    <button id="adminClose" class="admin-close">×</button>
    <h2>관리자 관리</h2>
    <div id="adminLoginBox">
      <input id="adminPwInput" type="password" placeholder="관리자 비밀번호">
      <button id="adminLoginDo" class="btn solid">로그인</button>
    </div>
    <div id="adminPanel" hidden>
      <div id="adminReports"></div>
    </div>
  </div>
</div><main class="wrap">
<section id="list"><h1>익명 평점</h1><p class="sub">캐릭터 챗 플랫폼, 익명으로 남기는 별점과 솔직한 후기</p>
<div class="listhead"><b>플랫폼</b><span id="count"></span></div><div id="platforms"></div></section>
<section id="detail" hidden><button class="back" id="back">← 목록</button><div class="detail"><h2 id="dname"></h2><div><span class="avg" id="avg">–</span></div><div class="muted" id="dcnt"></div></div>
<div class="write" id="writeArea"><button class="btn solid" id="write">리뷰 쓰기</button></div><div id="starStats"></div><div id="reviews"></div></section>
</main>
<div class="sheet" id="sheet"><div class="box"><h3 id="stitle">리뷰 쓰기</h3><p class="muted" id="target"></p>
<label>별점</label><div class="starpick" id="stars"></div>
<label>후기 (선택, 0~30자)</label><textarea id="body" maxlength="30"></textarea><div class="muted" style="text-align:right"><span id="len">0</span> / 30</div>
<label>특징 선택 · 최소 1개</label><div class="groups" id="groups"></div>
<div class="actions"><button class="btn" id="cancel">취소</button><button class="btn solid" id="save">등록하기</button></div></div></div>
<script>const API='/api/reviews';
const PLATFORMS=[("p-zeta", "제타"), ("p-bloom", "블룸"), ("p-wif", "위프"), ("p-caveduck", "케이브덕"), ("p-tingle", "팅글"), ("p-melting", "멜팅"), ("p-pltoon", "플툰"), ("p-rumo", "루모"), ("p-inkchat", "잉크챗"), ("p-umai", "우마이"), ("p-doomchit", "둠칫"), ("p-crack", "크랙"), ("p-veil", "베일"), ("p-kkuook", "꾸욱"), ("p-lape", "라페"), ("p-neona", "네오나"), ("p-tookit", "투킷"), ("p-lipin", "리핀"), ("p-ropan", "로판"), ("p-postype", "포스타입"), ("tikitaka", "티키타카"), ("moari", "모아리"), ("bellchat", "벨챗"), ("elin", "엘린"), ("tipot", "티팟"), ("crushpop", "크러쉬팝")];
const TAGS=[
['기술',['CSS 사용 가능','HTML 사용 가능','CSS 사용 불가','HTML 사용 불가']],
['UI',['Ui 좋음','Ui 보통','Ui 나쁨']],
['접속 방식',['홈페이지만 있음','어플 있음','홈페이지와 어플 둘 다 있음']],
['출력량',['출력량 좋음','출력량 보통','출력량 나쁨']],
['프롬프트',['프롬포르 글자수 김','프롬포트 글자수 짧음','프롬포트 글자수 보통','단축어 있음','단축어 없음']],
['기억력',['기억력 좋음','기억력 나쁨','기억력 보통']],
['모델',['모델 좋음','모델 보통','모델 나쁨']]
];

let REVIEWS=[],pid='',rating=0,chosen=[],editId=null,adminPw=localStorage.getItem('anonreview-admin-pw')||'';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sortedPlatforms=()=>[...PLATFORMS].sort((a,b)=>a[1].localeCompare(b[1],'ko'));
async function load(){const r=await fetch(API+'?t='+Date.now());const d=await r.json();if(!r.ok)throw Error(d.error||'불러오기 실패');REVIEWS=d.reviews||[];renderList();if(pid)renderDetail();}
function renderList(){ $('platforms').innerHTML=sortedPlatforms().map(p=>{const rs=REVIEWS.filter(r=>r.pid===p[0]),a=rs.length?(rs.reduce((x,r)=>x+r.rating,0)/rs.length).toFixed(1):'–';return `<button class="row" data-p="${p[0]}"><span class="score">${a}</span><span><span class="name">${esc(p[1])}</span><br><span class="meta">리뷰 ${rs.length}개</span></span></button>`}).join('');$('count').textContent=PLATFORMS.length+'곳 · 리뷰 '+REVIEWS.length+'개';document.querySelectorAll('#platforms [data-p]').forEach(b=>{
  b.addEventListener('click',e=>{
    e.preventDefault();
    e.stopPropagation();
    const selectedPid=b.getAttribute('data-p');
    open(selectedPid);
  });
});}
function open(x){pid=x;$('list').hidden=true;$('detail').hidden=false;renderDetail();scrollTo(0,0);}
$('back').onclick=()=>{pid='';$('detail').hidden=true;$('list').hidden=false;renderList();};
function renderDetail(){const p=PLATFORMS.find(x=>x[0]===pid),rs=REVIEWS.filter(r=>r.pid===pid);$('dname').textContent=p[1];$('dcnt').textContent='리뷰 '+rs.length+'개';$('avg').textContent=rs.length?(rs.reduce((a,r)=>a+r.rating,0)/rs.length).toFixed(1):'–';
const counts=[1,2,3,4,5].map(n=>rs.filter(r=>r.rating===n).length);
$('starStats').innerHTML='<div class="stats">'+counts.map((n,i)=>`<span class="stat">★ ${n}점 · ${i}개</span>`).join('')+'</div>';
const mine=getMine();
$('writeArea').innerHTML=mine
 ? '<button class="btn solid" id="myEdit">리뷰 수정</button>'
 : '<button class="btn solid" id="write">리뷰 쓰기</button>';
const wb=$('write'); if(wb) wb.onclick=openForm;
const me=$('myEdit'); if(me) me.onclick=()=>edit(mine.id);
$('reviews').innerHTML=rs.length?rs.slice().sort((a,b)=>b.ts-a.ts).map(r=>`<article class="review"><div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div><div class="muted">익명 · ${new Date(r.ts).toLocaleDateString('ko-KR')}${r.edited?' · 수정됨':''}</div><div>${esc(r.body)}</div><div class="tagwrap">${(r.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="review-actions">${mine?.id===r.id?'<button class="btn" data-edit="'+r.id+'">리뷰 수정</button>':''}<button class="btn danger" data-report="${r.id}">신고</button></div></article>`).join(''):'<div class="empty">아직 리뷰가 없어요.</div>';
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));
document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>report(b.dataset.report));}
function renderStars(){$('stars').innerHTML=[1,2,3,4,5].map(i=>`<button type="button" class="${i<=rating?'on':''}" data-r="${i}">${i<=rating?'★':'☆'}</button>`).join('');document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{rating=+b.dataset.r;renderStars();});}
function renderGroups(){$('groups').innerHTML=TAGS.map(g=>`<div><div class="gtitle">${esc(g[0])}</div><div class="choices">${g[1].map(t=>`<button type="button" class="choice ${chosen.includes(t)?'on':''}" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}</div></div>`).join('');document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{const t=b.dataset.tag;chosen=chosen.includes(t)?chosen.filter(x=>x!==t):[...chosen,t];renderGroups();});}
$('body').addEventListener('input',()=>$('len').textContent=$('body').value.length);
function getMine(){const id=localStorage.getItem('anonreview-id');return id?REVIEWS.find(r=>r.id===id&&r.pid===pid):null;}
function openForm(){if(!pid)return;editId=null;rating=0;chosen=[];$('body').value='';$('len').textContent=0;$('stitle').textContent='리뷰 쓰기';$('save').textContent='등록하기';$('target').textContent=PLATFORMS.find(x=>x[0]===pid)[1]+'에 대한 익명 리뷰';renderStars();renderGroups();$('sheet').classList.add('on');}
function edit(id){const r=REVIEWS.find(x=>x.id===id);if(r&&r.pid!==pid)return alert('현재 플랫폼의 리뷰만 수정할 수 있어요.');if(!r||getMine()?.id!==id)return alert('이 브라우저에서 작성한 리뷰만 수정할 수 있어요.');editId=id;rating=r.rating;chosen=[...(r.tags||[])];$('body').value=r.body||'';$('len').textContent=$('body').value.length;$('stitle').textContent='리뷰 수정';$('save').textContent='수정하기';$('target').textContent=PLATFORMS.find(x=>x[0]===r.pid)[1]+'에 대한 익명 리뷰';renderStars();renderGroups();$('sheet').classList.add('on');}
$('cancel').onclick=()=> $('sheet').classList.remove('on');
$('save').onclick=async()=>{if(rating<1)return alert('별점을 선택해 주세요.');if(chosen.length<1)return alert('특징을 하나 이상 선택해 주세요.');const body=$('body').value.trim();if(body.length>30)return alert('후기는 30자까지 입력할 수 있어요.');let browserToken=localStorage.getItem('anonreview-browser-token');if(!browserToken){browserToken=crypto.randomUUID();localStorage.setItem('anonreview-browser-token',browserToken);}const payload={action:editId?'edit':'add',pid,rating,body,tags:chosen,browserToken};if(editId){const r=REVIEWS.find(x=>x.id===editId);payload.id=editId;payload.sec=localStorage.getItem('anonreview-sec')||r?.sec;}try{const res=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});const d=await res.json();if(!res.ok)throw Error(d.error||'실패');if(!editId){localStorage.setItem('anonreview-id',d.review.id);localStorage.setItem('anonreview-sec',d.sec||'');}$('sheet').classList.remove('on');await load();}catch(e){alert(e.message);}};
async function report(id){const reason=prompt('신고 사유를 입력해 주세요. (예: 욕설, 광고, 부적절한 내용)');if(reason===null)return;try{const res=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'report',id,reason})});const d=await res.json();if(!res.ok)throw Error(d.error||'신고 실패');alert('신고가 접수되었습니다.');}catch(e){alert(e.message);}}
$('moreBtn').onclick=()=>{ $('adminModal').hidden=false; if(adminPw){$('adminLoginBox').hidden=true;$('adminPanel').hidden=false;loadAdmin();} };
$('adminClose').onclick=()=>{$('adminModal').hidden=true;};
$('adminLoginDo').onclick=async()=>{const pw=$('adminPwInput').value;if(!pw)return alert('비밀번호를 입력하세요.');const res=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'login',pw})});const d=await res.json();if(!d.ok)return alert('관리자 비밀번호가 올바르지 않아요.');adminPw=pw;localStorage.setItem('anonreview-admin-pw',pw);$('adminLoginBox').hidden=true;$('adminPanel').hidden=false;loadAdmin();};

async function loadAdmin(){if(!adminPw)return;const res=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'adminList',pw:adminPw})});const d=await res.json();if(!res.ok)return alert(d.error||'관리자 정보를 불러오지 못했어요.');const reports=d.reviews.filter(r=>(r.rp||[]).length);$('adminReports').innerHTML=reports.length?reports.map(r=>`<div class="admin-item"><b>${esc(PLATFORMS.find(p=>p[0]===r.pid)?.[1]||r.pid)}</b><div>${esc(r.body)}</div><div class="muted">신고 ${r.rp.length}건 · 사유: ${esc(r.rp.map(x=>x.reason).join(', '))}</div><button class="btn danger" data-admin-delete="${r.id}">리뷰 삭제</button><button class="btn" data-clear-report="${r.id}">신고 초기화</button></div>`).join(''):'<div class="empty">신고된 리뷰가 없어요.</div>';
document.querySelectorAll('[data-admin-delete]').forEach(b=>b.onclick=()=>adminAction('delete',b.dataset.adminDelete));
document.querySelectorAll('[data-clear-report]').forEach(b=>b.onclick=()=>adminAction('clearReports',b.dataset.clearReport));}
async function adminAction(action,id){if(!confirm(action==='delete'?'이 리뷰를 삭제할까요?':'이 리뷰의 신고를 초기화할까요?'))return;const res=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,id,pw:adminPw})});const d=await res.json();if(!res.ok)return alert(d.error||'처리 실패');await load();loadAdmin();}
if(adminPw){ $('adminPanel').hidden=true; $('adminLoginBox').hidden=false; }
load().catch(e=>alert(e.message));
</script></body></html>
