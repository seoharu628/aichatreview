<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>익명 평점</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;800&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#E7ECEC;--card:#F6F8F8;--ink:#14211F;--teal:#1F4E45;--amber:#C98A18;--muted:#77857F;--line:#C9D2D0}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;
    font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:0 20px 96px}
  button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px}

  .top{padding:34px 0 18px}
  .tophead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .top h1{font-family:"Hahmlet",serif;font-weight:800;font-size:31px;letter-spacing:-.02em;line-height:1.15;margin:0}
  .top p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
  .dots{background:none;border:0;color:var(--muted);font-size:17px;letter-spacing:2px;padding:8px 2px;line-height:1}

  .listhead{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1.5px solid var(--ink);padding-bottom:8px;margin-top:20px}
  .listhead span{font-size:13px;color:var(--muted)}
  .rows{list-style:none;margin:0;padding:0}
  .row{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;width:100%;text-align:left;
    background:none;border:0;border-bottom:1px solid var(--line);padding:16px 2px}
  .row:hover .rname{text-decoration:underline;text-underline-offset:3px}
  .score{font-family:"Hahmlet",serif;font-weight:600;font-size:30px;line-height:1;letter-spacing:-.03em;text-align:right}
  .score.none{color:var(--line);font-size:22px}
  .rname{font-weight:500;font-size:16.5px;line-height:1.35;word-break:keep-all}
  .rmeta{display:flex;align-items:center;gap:8px;margin-top:6px}
  .rmeta small{color:var(--muted);font-size:12.5px;white-space:nowrap}
  .bar{display:flex;height:5px;flex:1;max-width:120px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%}
  .empty{border:1px dashed var(--line);padding:28px 20px;text-align:center;color:var(--muted);font-size:14px;margin-top:8px}

  .searchbar{display:flex;gap:8px;align-items:center;margin-top:18px}
  .searchbar input{flex:1;font-family:inherit;font-size:16px;background:var(--card);border:1px solid var(--line);
    border-radius:0;padding:11px 12px;color:var(--ink);-webkit-appearance:none}
  .searchbar input:focus{border-color:var(--teal);outline:none}
  .searchbar button{background:none;border:0;color:var(--muted);font-size:13px;padding:6px 2px;text-decoration:underline}
  .reshead{border-bottom:1.5px solid var(--ink);padding:18px 0 8px;font-size:13px;color:var(--muted)}
  .rvwhere{display:inline-block;background:none;border:0;padding:0;font-weight:500;font-size:14px;box-shadow:inset 0 -1.5px 0 var(--amber)}
  mark{background:#F3DFA0;color:var(--ink);padding:0 1px}

  .status{background:var(--card);border-left:3px solid var(--amber);padding:11px 13px;margin:16px 0 0;font-size:12.5px;line-height:1.6}
  .status button{background:none;border:0;padding:0;margin-left:6px;font-size:12.5px;color:var(--teal);text-decoration:underline}

  .btn{border:1.5px solid var(--ink);background:none;padding:10px 16px;font-weight:500;font-size:14px;border-radius:0}
  .btn.solid{background:var(--teal);border-color:var(--teal);color:#fff}
  .btn.solid:disabled{opacity:.45;cursor:default}
  .btn.ghost{border-color:var(--line);color:var(--muted)}

  .back{background:none;border:0;padding:8px 0;color:var(--muted);font-size:13.5px}
  .detailhead{border-bottom:1.5px solid var(--ink);padding-bottom:18px}
  .detailhead h2{font-family:"Hahmlet",serif;font-weight:600;font-size:25px;margin:2px 0 14px;letter-spacing:-.02em;word-break:keep-all}
  .avgblock{display:flex;align-items:flex-end;gap:16px}
  .avgnum{font-family:"Hahmlet",serif;font-weight:800;font-size:52px;line-height:.9;letter-spacing:-.04em}
  .avgside{padding-bottom:4px}
  .avgside div{color:var(--muted);font-size:13px}
  .dist{margin:16px 0 0;display:grid;gap:4px}
  .distrow{display:grid;grid-template-columns:32px 1fr 24px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
  .distrow .bar{max-width:none;height:7px}

  .sorts{display:flex;gap:14px;padding:16px 0 4px}
  .sorts button{background:none;border:0;padding:2px 0;font-size:13px;color:var(--muted)}
  .sorts button[aria-pressed="true"]{color:var(--ink);font-weight:500;box-shadow:inset 0 -1.5px 0 var(--amber)}

  .review{background:var(--card);border-left:3px solid var(--teal);padding:14px 16px;margin-bottom:10px}
  .review.flagged{border-left-color:#B4433A}
  .rvtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
  .stars{color:var(--amber);font-size:14px;letter-spacing:1px;white-space:nowrap}
  .stars b{color:var(--line);font-weight:400}
  .rvwho{color:var(--muted);font-size:12px;white-space:nowrap}
  .rvbody{white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.8}
  .more{background:none;border:0;padding:8px 0 0;font-size:12.5px;color:var(--teal);text-decoration:underline}
  .rvfoot{display:flex;gap:14px;align-items:center;padding-top:8px}
  .rvdel,.rvedit,.flag{background:none;border:0;color:var(--muted);font-size:12px;padding:0;text-decoration:underline}
  .rsn{color:var(--muted);font-size:12px;margin-top:8px;line-height:1.6}
  .badge{display:inline-block;background:#B4433A;color:#fff;font-size:11px;padding:1px 7px;margin-left:6px}
  .adminact{display:flex;gap:10px;padding-top:10px}
  .adminact button{background:none;border:0;font-size:12.5px;padding:0;text-decoration:underline;color:var(--muted)}
  .adminact button.danger{color:#B4433A}

  .sheet{position:fixed;inset:0;background:rgba(20,33,31,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
  .sheet.on{display:flex}
  .sheetbox{background:var(--paper);width:100%;max-width:560px;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
  .sheetbox h3{font-family:"Hahmlet",serif;font-weight:600;font-size:20px;margin:0 0 4px}
  .sheetbox p.hint{color:var(--muted);font-size:13px;margin:0 0 18px}
  label.fl{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  textarea{width:100%;font-family:inherit;font-size:16px;line-height:1.7;background:var(--card);border:1px solid var(--line);
    padding:11px 12px;color:var(--ink);border-radius:0;min-height:170px;resize:vertical}
  textarea:focus{border-color:var(--teal);outline:none}
  .pwinput{width:100%;font-family:inherit;font-size:16px;background:var(--card);border:1px solid var(--line);
    padding:11px 12px;color:var(--ink);border-radius:0;-webkit-appearance:none}
  .pwinput:focus{border-color:var(--teal);outline:none}
  .starpick{display:flex;gap:4px;margin-bottom:18px}
  .starpick button{background:none;border:0;padding:2px 4px;font-size:30px;line-height:1;color:var(--line);transition:color .12s,transform .12s}
  .starpick button.on{color:var(--amber)}
  .starpick button:active{transform:scale(.9)}
  .counter{text-align:right;font-size:12px;color:var(--muted);margin-top:6px}
  .reasons{display:grid;gap:8px}
  .reasons button{text-align:left;background:var(--card);border:1px solid var(--line);padding:11px 12px;font-size:14px}
  .reasons button.on{border-color:var(--teal);box-shadow:inset 3px 0 0 var(--teal)}
  .acts{display:flex;gap:8px;margin-top:18px}
  .acts .btn{flex:1;padding:13px}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    padding:11px 18px;font-size:13.5px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw}
  .toast.on{opacity:1}
  .loading{color:var(--muted);font-size:14px;padding:30px 0;text-align:center}
  .note{color:var(--muted);font-size:12px;line-height:1.6;margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}


  .taggroups{display:grid;gap:12px;margin-top:6px}
  .taggroup-title{font-size:12px;color:var(--muted);margin-bottom:5px}
  .taggroup-buttons{display:flex;flex-wrap:wrap;gap:7px}
  .tagpick{background:var(--card);border:1px solid var(--line);padding:8px 10px;font-size:13px;border-radius:0}
  .tagpick.on{border-color:var(--teal);background:var(--teal);color:#fff}

  .review-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .review-tags span{border:1px solid var(--line);padding:2px 7px;font-size:11px;color:var(--muted);background:var(--paper)}
</style>
</head>
<body>
<div class="wrap">

  <section id="view-list">
    <div class="top">
      <div class="tophead">
        <h1>익명 평점</h1>
        <button class="dots" id="btn-admin" aria-label="관리자 메뉴">•••</button>
      </div>
      <p>캐릭터 챗 플랫폼, 이름 없이 남기는 별점과 솔직한 후기</p>
    </div>
    <div class="searchbar">
      <input type="search" id="q" placeholder="리뷰 내용, 플랫폼 이름 검색" autocomplete="off">
      <button id="q-clear" hidden>지우기</button>
    </div>
    <div id="search-results" hidden></div>
    <div id="browse">
      <div class="status" id="status" hidden></div>
  <div class="listhead"><strong style="font-size:14px">플랫폼</strong><span id="count-label"></span></div>
      <div class="sorts" id="list-sorts">
        <button data-lsort="name" aria-pressed="true">가나다순</button>
        <button data-lsort="count" aria-pressed="false">리뷰 많은순</button>
      </div>
      <div id="list-body"><div class="loading">불러오는 중…</div></div>
      <p class="note">현재 리뷰는 열람만 가능합니다. 새로운 리뷰 작성과 새로운 리뷰 작성 기능은 제공하지 않습니다.</p>
    </div>
  </section>

  <section id="view-detail" hidden>
    <button class="back" id="btn-back">← 목록</button>
    <div class="addbar"><button class="btn solid" id="btn-write" style="width:100%;padding:13px">리뷰 쓰기</button></div>
    <div class="detailhead">
      <h2 id="d-name"></h2>
      <div class="avgblock">
        <div class="avgnum" id="d-avg">–</div>
        <div class="avgside">
          <div id="d-stars" class="stars"></div>
          <div id="d-count"></div>
        </div>
      </div>
      <div class="dist" id="d-dist"></div>
    </div>
    <div class="sorts" id="detail-sorts">
      <button data-sort="new" aria-pressed="true">최신순</button>
      <button data-sort="high" aria-pressed="false">별점 높은순</button>
      <button data-sort="low" aria-pressed="false">별점 낮은순</button>
    </div>
    <div id="d-reviews"></div>
    
  </section>

  <section id="view-admin" hidden>
    <button class="back" id="btn-admin-back">← 나가기</button>
    <div class="listhead" style="margin-top:6px"><strong style="font-size:14px">관리자</strong><span id="admin-count"></span></div>
    <div class="sorts" id="admin-tabs">
      <button data-tab="reported" aria-pressed="true">신고된 리뷰</button>
      <button data-tab="all" aria-pressed="false">전체 리뷰</button>
      <button data-tab="reload" aria-pressed="false">새로고침</button>
      <button data-tab="clearall" aria-pressed="false">전체 리뷰 삭제</button>
    </div>
    <div id="admin-body"></div>
  </section>
</div>


<div class="sheet" id="sheet-review">
  <div class="sheetbox">
    <h3 id="r-title">리뷰 쓰기</h3>
    <p class="hint" id="r-target"></p>

    <label class="fl">후기 (선택)</label>
    <textarea id="r-body" maxlength="30" placeholder="후기를 짧게 남겨주세요. (선택)"></textarea>
    <div class="counter"><span id="r-count">0</span> / 30</div>

    <label class="fl" style="margin-top:16px">특징 선택 <span style="color:var(--amber)">· 최소 1개</span></label>
    <div class="taggroups" id="r-tags"></div>

    <div class="acts">
      <button class="btn ghost" data-close="sheet-review">취소</button>
      <button class="btn solid" id="r-save">리뷰 등록</button>
    </div>
  </div>
</div>

<div class="sheet" id="sheet-report">
  <div class="sheetbox">
    <h3>리뷰 신고</h3>
    <p class="hint">어떤 점이 문제인가요? 관리자가 확인 후 처리합니다.</p>
    <div class="reasons" id="reason-list"></div>
    <div class="acts">
      <button class="btn ghost" data-close="sheet-report">취소</button>
      <button class="btn solid" id="report-ok">신고하기</button>
    </div>
  </div>
</div>

<div class="sheet" id="sheet-pw">
  <div class="sheetbox">
    <h3>관리자 확인</h3>
    <p class="hint">비밀번호를 입력하면 신고된 리뷰를 관리할 수 있어요.</p>
    <input class="pwinput" type="password" id="pw" autocomplete="off" placeholder="비밀번호">
    <div class="acts">
      <button class="btn ghost" data-close="sheet-pw">취소</button>
      <button class="btn solid" id="pw-ok">들어가기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PLATFORMS=[
  {id:'p-zeta',name:'제타'},{id:'p-bloom',name:'블룸'},{id:'p-wif',name:'위프'},
  {id:'p-caveduck',name:'케이브덕'},{id:'p-tingle',name:'팅글'},{id:'p-melting',name:'멜팅'},
  {id:'p-pltoon',name:'플툰'},{id:'p-rumo',name:'루모'},{id:'p-inkchat',name:'잉크챗'},
  {id:'p-umai',name:'우마이'},{id:'p-doomchit',name:'둠칫'},{id:'p-crack',name:'크랙'},
  {id:'p-veil',name:'베일'},{id:'p-kkuook',name:'꾸욱'},{id:'p-lape',name:'라페'},
  {id:'p-neona',name:'네오나'},{id:'p-tookit',name:'투킷'},{id:'p-lipin',name:'리핀'},
  {id:'p-ropan',name:'로판'},{id:'p-postype',name:'포스타입'},
  {id:'tikitaka',name:'티키타'},
  {id:'moari',name:'모아리'},
  {id:'bellchat',name:'벨챗',desc:'AI 캐릭터와 대화하는 서비스',cat:'AI 채팅',url:'#',icon:'B'},
  {id:'elin',name:'엘린',desc:'AI 캐릭터와 대화하는 서비스',cat:'AI 채팅',url:'#',icon:'엘'},
  {id:'tipot',name:'티팟',desc:'AI 캐릭터와 대화하는 서비스',cat:'AI 채팅',url:'#',icon:'티'},
  {id:'crushpop',name:'크러쉬팝',desc:'AI 캐릭터와 대화하는 서비스',cat:'AI 채팅',url:'#',icon:'CP'}];
const REASONS=['광고·홍보','욕설·비방','허위 내용','개인정보 노출','도배·중복','기타'];
const API='/api/reviews', LKEY='anonreview-local';

let REVIEWS=[];            // 서버에서 받은 전체 리뷰
let MY={reported:[]};   // 이 브라우저의 신고 기록
let adminPw=null;
let curPid=null, sortMode='new', listSort='name', pickRating=0, editTarget=null;
let reportTarget=null, reportReason=null, adminTab='reported';
const OPEN=new Set();            // 펼쳐 본 긴 리뷰
const FOLD=700;                  // 이 길이를 넘으면 접어서 보여준다

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stars=n=>'★'.repeat(n)+'<b>'+'★'.repeat(5-n)+'</b>';
const fdate=t=>{const d=new Date(t);return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600);}

/* ===== 로컬 기록 (신고 여부) ===== */
function loadLocal(){
  try{
    const v=localStorage.getItem(LKEY);
    if(v){
      const d=JSON.parse(v);
      MY={reported:d.reported||[]};
    }
  }catch(e){}
}
function saveLocal(){
  try{localStorage.setItem(LKEY,JSON.stringify(MY));}catch(e){}
}

/* ===== 서버 ===== */
async function readJson(res){
  const text=await res.text();
  try{ return JSON.parse(text); }
  catch(e){
    if(res.status===404) throw new Error('API 주소를 찾을 수 없어요 (404). functions/api/reviews.js 가 함께 배포됐는지 확인해 주세요');
    if(text.slice(0,20).toLowerCase().includes('<!doctype')) throw new Error('서버가 JSON 대신 웹페이지를 돌려줬어요 ('+res.status+'). functions 폴더가 빠진 배포입니다');
    throw new Error('응답 형식이 이상해요 ('+res.status+')');
  }
}
async function api(payload){
  let session=''; try{session=localStorage.getItem('anonreview-session')||'';}catch(e){}
  const send=Object.assign({},payload,{session});
  const res=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(send)});
  const data=await readJson(res);
  if(!res.ok) throw new Error(data.error||('오류 '+res.status));
  return data;
}
async function fetchReviews(){
  const res=await fetch(API,{cache:'no-store'});
  const data=await readJson(res);
  if(!res.ok) throw new Error(data.error||('오류 '+res.status));
  REVIEWS=data.reviews||[];
}
function showError(msg){
  const el=$('status'); el.hidden=false;
  el.innerHTML=esc(msg)+'<button id="btn-retry">다시 시도</button>';
  $('btn-retry').onclick=refresh;
}
async function refresh(){
  try{
    await fetchReviews();
    $('status').hidden=true;
  }catch(e){
    showError('리뷰를 불러오지 못했어요: '+((e&&e.message)||e));
  }
  renderList();
}

/* ===== 계산 ===== */
const reviewsOf=pid=>REVIEWS.filter(r=>r.pid===pid);
function summary(pid){
  const rs=reviewsOf(pid), n=rs.length, dist=[0,0,0,0,0];
  rs.forEach(r=>dist[r.rating-1]++);
  return {n,avg:n?rs.reduce((a,b)=>a+b.rating,0)/n:0,dist};
}
function distBar(dist,total){
  if(!total) return '<span class="bar"></span>';
  const tone=['#B4433A','#C4763A','#C9A33A','#5C8A5A','#1F4E45'];
  return '<span class="bar">'+dist.map((c,i)=>c?`<i style="width:${c/total*100}%;background:${tone[i]}"></i>`:'').join('')+'</span>';
}

/* ===== 목록 ===== */
function renderList(){
  const byName=(a,b)=>a.p.name.localeCompare(b.p.name,'ko');
  const items=PLATFORMS.map(p=>({p,s:summary(p.id)}));
  items.sort(listSort==='name'?byName:(a,b)=>b.s.n-a.s.n||b.s.avg-a.s.avg||byName(a,b));
  $('list-body').innerHTML='<ul class="rows">'+items.map(({p,s})=>`
    <li><button class="row" data-pid="${p.id}">
      <span class="score ${s.n?'':'none'}">${s.n?s.avg.toFixed(1):'–'}</span>
      <span><span class="rname">${esc(p.name)}</span>
      <span class="rmeta"><small>리뷰 ${s.n}개</small>${distBar(s.dist,s.n)}</span></span>
    </button></li>`).join('')+'</ul>';
  $('count-label').textContent=`${PLATFORMS.length}곳 · 리뷰 ${REVIEWS.length}개`;
  $('list-body').querySelectorAll('.row').forEach(b=>b.onclick=()=>openDetail(b.dataset.pid));
}

/* ===== 상세 ===== */
async function openDetail(pid){
  curPid=pid; sortMode='new';
  try{localStorage.setItem('anonreview-current-platform',pid);}catch(e){}
  document.querySelectorAll('#detail-sorts button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.sort==='new'));
  $('view-list').hidden=true; $('view-detail').hidden=false;
  window.scrollTo(0,0);
  renderDetail();
  try{
    await fetchReviews();
  }catch(e){
    // 리뷰 조회가 실패해도 작성 UI 자체는 막지 않습니다.
  }
  renderDetail();
}
function renderDetail(){
  const p=PLATFORMS.find(x=>x.id===curPid);
  if(!p){backToList();return;}
  const s=summary(curPid);
  $('d-name').textContent=p.name;
  $('d-avg').textContent=s.n?s.avg.toFixed(1):'–';
  $('d-stars').innerHTML=s.n?stars(Math.round(s.avg)):'';
  $('d-count').textContent=s.n?`리뷰 ${s.n}개`:'첫 리뷰를 기다리는 중';
  $('d-dist').innerHTML=s.n?[5,4,3,2,1].map(k=>
    `<div class="distrow"><span>${k}점</span>${distBar(s.dist.map((v,i)=>i===k-1?v:0),s.n)}<span style="text-align:right">${s.dist[k-1]}</span></div>`
  ).join(''):'';

  let rs=reviewsOf(curPid).slice();
  if(sortMode==='new') rs.sort((a,b)=>b.ts-a.ts);
  if(sortMode==='high') rs.sort((a,b)=>b.rating-a.rating||b.ts-a.ts);
  if(sortMode==='low') rs.sort((a,b)=>a.rating-b.rating||b.ts-a.ts);

  $('d-reviews').innerHTML=rs.length?rs.map(r=>{
    const long=r.body.length>FOLD, open=OPEN.has(r.id);
    const shown=(long&&!open)?r.body.slice(0,FOLD)+'…':r.body;
    return `<article class="review">
      <div class="rvtop">
        <span class="stars">${stars(r.rating)}</span>
        <span class="rvwho">${esc(r.tag)} · ${fdate(r.ts)}${r.edited?' · 수정됨':''}${long?' · '+r.body.length+'자':''}</span>
      </div>
      <div class="rvbody">${esc(shown)}</div><div class="review-tags">${(r.tags||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div>
      ${long?`<button class="more" data-more="${r.id}">${open?'접기':'더 보기'}</button>`:''}
      <div class="rvfoot">
        <button class="flag" data-report="${r.id}">${MY.reported.includes(r.id)?'신고함':'신고'}</button>
      </div>
    </article>`;}).join(''):'<div class="empty">아직 리뷰가 없어요. 먼저 남겨보세요.</div>';
  $('d-reviews').querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>openReport(b.dataset.report));
  $('d-reviews').querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.more;
    OPEN.has(id)?OPEN.delete(id):OPEN.add(id);
    renderDetail();
  });
}
$('btn-back').onclick=()=>backToList();
function backToList(){
  try{localStorage.removeItem('anonreview-current-platform');}catch(e){}
  $('view-detail').hidden=true;$('view-admin').hidden=true;$('view-list').hidden=false;
  renderList();doSearch();refresh();
}

/* ===== 검색 ===== */
function hl(text,q){
  const eq=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return esc(text).replace(new RegExp(eq,'gi'),m=>`<mark>${m}</mark>`);
}
function snippet(body,lq){
  if(body.length<=220) return body;
  const i=body.toLowerCase().indexOf(lq), start=Math.max(0,i-60);
  return (start>0?'…':'')+body.slice(start,start+220)+(start+220<body.length?'…':'');
}
function doSearch(){
  const q=$('q').value.trim(); $('q-clear').hidden=!q;
  const box=$('search-results');
  if(!q){box.hidden=true;$('browse').hidden=false;box.innerHTML='';return;}
  $('browse').hidden=true; box.hidden=false;
  const lq=q.toLowerCase();
  const pm=PLATFORMS.filter(p=>p.name.toLowerCase().includes(lq)).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  const rm=REVIEWS.filter(r=>r.body.toLowerCase().includes(lq)).sort((a,b)=>b.ts-a.ts);
  const nameOf=pid=>(PLATFORMS.find(p=>p.id===pid)||{name:'알 수 없음'}).name;
  if(!pm.length&&!rm.length){box.innerHTML=`<div class="empty">'${esc(q)}'와 맞는 결과가 없어요.<br>다른 단어로 찾아보세요.</div>`;return;}
  let html='';
  if(pm.length){
    html+='<div class="reshead">플랫폼 '+pm.length+'곳</div><ul class="rows">'+pm.map(p=>{
      const s=summary(p.id);
      return `<li><button class="row" data-pid="${p.id}">
        <span class="score ${s.n?'':'none'}">${s.n?s.avg.toFixed(1):'–'}</span>
        <span><span class="rname">${hl(p.name,q)}</span>
        <span class="rmeta"><small>리뷰 ${s.n}개</small>${distBar(s.dist,s.n)}</span></span>
      </button></li>`;}).join('')+'</ul>';
  }
  if(rm.length){
    html+='<div class="reshead">리뷰 '+rm.length+'개</div>'+rm.map(r=>`
      <article class="review">
        <div class="rvtop">
          <button class="rvwhere" data-pid="${r.pid}">${esc(nameOf(r.pid))}</button>
          <span class="rvwho">${esc(r.tag)} · ${fdate(r.ts)}</span>
        </div>
        <div class="stars" style="margin-bottom:6px">${stars(r.rating)}</div>
        <div class="rvbody">${hl(snippet(r.body,lq),q)}</div>
      </article>`).join('');
  }
  box.innerHTML=html;
  box.querySelectorAll('[data-pid]').forEach(b=>b.onclick=()=>openDetail(b.dataset.pid));
}
$('q').addEventListener('input',doSearch);
$('q-clear').onclick=()=>{$('q').value='';doSearch();$('q').focus();};
document.querySelectorAll('#list-sorts button').forEach(b=>b.onclick=()=>{
  listSort=b.dataset.lsort;
  document.querySelectorAll('#list-sorts button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  renderList();
});
document.querySelectorAll('#detail-sorts button').forEach(b=>b.onclick=()=>{
  sortMode=b.dataset.sort;
  document.querySelectorAll('#detail-sorts button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  renderDetail();
});

/* ===== 시트 ===== */
function openSheet(id){$(id).classList.add('on');}
function closeSheet(id){$(id).classList.remove('on');}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeSheet(b.dataset.close));
document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{if(e.target===s)s.classList.remove('on');}));


/* ===== 익명 리뷰 쓰기 ===== */
const REVIEW_TAG_GROUPS = [
  {title:'기술', items:['CSS 사용 가능','HTML 사용 가능','CSS 사용 불가','HTML 사용 불가']},
  {title:'UI', items:['Ui 좋음','Ui 보통','Ui 나쁨']},
  {title:'접속 방식', items:['홈페이지만 있음','어플 있음','홈페이지와 어플 둘 다 있음']},
  {title:'출력량', items:['출력량 좋음','출력량 보통','출력량 나쁨']},
  {title:'모델', items:['모델 좋음','모델 보통','모델 나쁨']}
];
let selectedTags=[];

function renderTagPicker(){
  const box=$('r-tags');
  if(!box)return;
  box.innerHTML=REVIEW_TAG_GROUPS.map(g=>`
    <div class="taggroup">
      <div class="taggroup-title">${esc(g.title)}</div>
      <div class="taggroup-buttons">
        ${g.items.map(t=>`<button type="button" class="tagpick${selectedTags.includes(t)?' on':''}" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}
      </div>
    </div>
  `).join('');
  box.querySelectorAll('.tagpick').forEach(b=>b.onclick=()=>{
    const t=b.dataset.tag;
    if(selectedTags.includes(t)){
      selectedTags=selectedTags.filter(x=>x!==t);
    }else{
      selectedTags.push(t);
    }
    renderTagPicker();
  });
}

if($('r-body')){
  $('r-body').addEventListener('input',e=>$('r-count').textContent=e.target.value.length);
}

$('btn-write').onclick=()=>{
  editTarget=null;
  selectedTags=[];
  $('r-body').value='';
  $('r-count').textContent='0';
  $('r-title').textContent='리뷰 쓰기';
  $('r-save').textContent='리뷰 등록';
  const p=PLATFORMS.find(x=>x.id===curPid);
  $('r-target').textContent=p?`${p.name}에 대한 익명 리뷰`:'';
  renderTagPicker();
  openSheet('sheet-review');
};

$('r-save').onclick=async()=>{
  const body=$('r-body').value.trim();

  if(body.length>30){
    toast('후기는 30자까지 입력할 수 있어요');
    return;
  }

  if(selectedTags.length<1){
    toast('특징을 하나 이상 선택해 주세요');
    return;
  }

  const bannedWords=['ㅈ목','친목','친목질','친.목','ㅊ목','디씨','디씨인사이드'];
  const blocked=bannedWords.find(w=>body.includes(w));
  if(blocked){
    toast('사용할 수 없는 단어가 포함되어 있어요');
    return;
  }

  const btn=$('r-save');
  btn.disabled=true;
  btn.textContent='등록 중…';

  try{
    const d=await api({
      action:'add',
      pid:curPid,
      body,
      tags:selectedTags
    });

    closeSheet('sheet-review');
    await fetchReviews();
    renderDetail();
    toast('익명으로 등록했어요');
  }catch(e){
    toast('등록 실패: '+((e&&e.message)||e));
  }

  btn.disabled=false;
  btn.textContent='리뷰 등록';
};

/* ===== 신고 ===== */
$('reason-list').innerHTML=REASONS.map(r=>`<button data-reason="${esc(r)}">${esc(r)}</button>`).join('');
$('reason-list').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  reportReason=b.dataset.reason;
  $('reason-list').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
});
function openReport(id){
  if(MY.reported.includes(id)){toast('이미 신고한 리뷰예요');return;}
  reportTarget=id; reportReason=null;
  $('reason-list').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  openSheet('sheet-report');
}
$('report-ok').onclick=async()=>{
  if(!reportReason){toast('사유를 골라주세요');return;}
  const btn=$('report-ok'); btn.disabled=true; btn.textContent='보내는 중…';
  try{
    await api({action:'report',id:reportTarget,reason:reportReason});
    MY.reported.push(reportTarget); saveLocal();
    closeSheet('sheet-report'); renderDetail(); toast('신고했어요. 관리자가 확인합니다');
  }catch(e){toast('신고 실패: '+((e&&e.message)||e));}
  btn.disabled=false; btn.textContent='신고하기';
};

/* ===== 관리자 ===== */
$('btn-admin').onclick=()=>{$('pw').value='';openSheet('sheet-pw');setTimeout(()=>$('pw').focus(),60);};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('pw-ok').click();});
$('pw-ok').onclick=async()=>{
  const v=$('pw').value;
  const btn=$('pw-ok'); btn.disabled=true; btn.textContent='확인 중…';
  try{
    const d=await api({action:'login',pw:v});
    if(!d.ok){toast('비밀번호가 맞지 않아요');}
    else{
      adminPw=v; closeSheet('sheet-pw');
      $('view-list').hidden=true; $('view-detail').hidden=true; $('view-admin').hidden=false;
      window.scrollTo(0,0);
      await fetchReviews(); renderAdmin();
    }
  }catch(e){toast('확인 실패: '+((e&&e.message)||e));}
  btn.disabled=false; btn.textContent='들어가기';
};
$('btn-admin-back').onclick=()=>{adminPw=null;backToList();};
document.querySelectorAll('#admin-tabs button').forEach(b=>b.onclick=async()=>{
  if(b.dataset.tab==='reload'){
    try{await fetchReviews();renderAdmin();toast('새로 불러왔어요');}
    catch(e){toast('실패: '+e.message);}
    return;
  }
  if(b.dataset.tab==='clearall'){
    if(!confirm('기존 리뷰를 전부 삭제할까요? 되돌릴 수 없어요.')) return;
    try{
      await api({action:'clearAll',pw:adminPw});
      await fetchReviews();
      adminTab='all';
      document.querySelectorAll('#admin-tabs button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.tab==='all'));
      renderAdmin();
      toast('모든 리뷰를 삭제했어요');
    }catch(e){
      toast('전체 삭제 실패: '+e.message);
    }
    return;
  }
  adminTab=b.dataset.tab;
  document.querySelectorAll('#admin-tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  renderAdmin();
});
function renderAdmin(){
  const nameOf=pid=>(PLATFORMS.find(p=>p.id===pid)||{name:'알 수 없음'}).name;
  const flagged=REVIEWS.filter(r=>r.rp&&r.rp.length);
  const list=(adminTab==='reported'?flagged:REVIEWS.slice())
    .sort((a,b)=>((b.rp||[]).length-(a.rp||[]).length)||b.ts-a.ts);
  $('admin-count').textContent=`신고 ${flagged.length}건 · 전체 ${REVIEWS.length}개`;
  $('admin-body').innerHTML=list.length?list.map(r=>{
    const n=(r.rp||[]).length;
    const reasons=n?[...new Set(r.rp.map(x=>x.reason))].join(', '):'';
    return `<article class="review${n?' flagged':''}">
      <div class="rvtop">
        <span class="stars">${stars(r.rating)}</span>
        <span class="rvwho">${esc(nameOf(r.pid))} · ${fdate(r.ts)}${n?`<span class="badge">신고 ${n}</span>`:''}</span>
      </div>
      <div class="rvbody">${esc(r.body)}</div>
      ${n?`<div class="rsn">신고 사유: ${esc(reasons)}</div>`:''}
      <div class="adminact">
        <button class="danger" data-adel="${r.id}">리뷰 삭제</button>
        ${n?`<button data-aclear="${r.id}">신고 취소</button>`:''}
      </div>
    </article>`;}).join(''):`<div class="empty">${adminTab==='reported'?'신고된 리뷰가 없어요.':'등록된 리뷰가 없어요.'}</div>`;
  $('admin-body').querySelectorAll('[data-adel]').forEach(b=>b.onclick=()=>adminDelete(b.dataset.adel));
  $('admin-body').querySelectorAll('[data-aclear]').forEach(b=>b.onclick=()=>adminClear(b.dataset.aclear));
}
async function adminDelete(id){
  if(!confirm('이 리뷰를 삭제할까요? 되돌릴 수 없어요.')) return;
  try{
    await api({action:'delete',id,pw:adminPw});
    await fetchReviews(); renderAdmin(); toast('삭제했어요');
  }catch(e){toast('삭제 실패: '+((e&&e.message)||e));}
}
async function adminClear(id){
  try{
    await api({action:'clearReports',id,pw:adminPw});
    await fetchReviews(); renderAdmin(); toast('신고 기록을 지웠어요');
  }catch(e){toast('처리 실패: '+((e&&e.message)||e));}
}



loadLocal();
// 이전에 저장된 reviewed 값만으로 버튼을 숨기지 않습니다.
MY.reviewed=false;
updateWriteButton();

(async function boot(){
  await refresh();
  let savedPid=null;
  try{savedPid=localStorage.getItem('anonreview-current-platform');}catch(e){}
  if(savedPid && PLATFORMS.some(p=>p.id===savedPid)){
    await openDetail(savedPid);
  }
})();
</script>
